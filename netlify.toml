[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Redirect all API calls to Netlify functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Scheduled function: fetch new ETFs every Monday at 9am ET
[functions."fetch-etfs"]
  schedule = "0 14 * * 1"
